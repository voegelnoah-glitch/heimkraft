<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HeimKraft">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HeimKraft Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: kräftig, klar, motivierend – eine fertige Trainings-App, kein Prospekt
   IDEA: das Trainingsprotokoll an der Gym-Tafel, das selbst mitzählt
   PICTURE: die Heute-Karte als volles Farbfeld mit Wochenring; im Training der große Timer-Ring
   COLOUR and TYPE: kalkweiß / anthrazit, eine kräftige Signalfarbe (wählbar); Barlow Condensed + Barlow
   LAYOUT: App-Schale bis 1100px, Tabs oben am Desktop, unten am Handy; Training als Vollbild */
:root{color-scheme:light dark;--bg:light-dark(#f3f2ee,#0f1012);--card:light-dark(#fff,#1a1c1f);--ink:light-dark(#15171a,#f2f1ec);--mut:light-dark(#5b5f66,#a2a6ac);--line:light-dark(#e3e1da,#2c2f34);--soft:light-dark(#efeee8,#24272b);--acc:#e8401f;--on:#fff;--r:18px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html.big{font-size:112.5%}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;text-wrap:balance}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px max(4vw,16px)}
.logo{font:800 1.6rem/1 "Barlow Condensed",sans-serif;display:flex;align-items:center;gap:10px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--on);display:grid;place-items:center}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:0;background:none;color:var(--mut);font:600 .95rem Barlow,sans-serif;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current=page]{background:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:auto;padding:24px max(4vw,16px) 56px}
.view{display:none}.view.on{display:block}
.title{font-weight:700;font-size:clamp(2rem,4.5vw,2.9rem);line-height:1.05;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
h2{font-weight:700;font-size:1.55rem;line-height:1.1;margin:0 0 12px}
h3{font-weight:700;font-size:1.25rem;line-height:1.15;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.hint{color:var(--mut);font-size:.9rem;display:block}
.lbl{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--soft);font-size:.85rem;font-weight:600;white-space:nowrap}
.btn{min-height:48px;padding:0 20px;border-radius:14px;border:0;font:700 1rem Barlow,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{min-height:58px;font-size:1.15rem;padding:0 28px}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:var(--on)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:#c62828;color:#fff}
.ico{width:44px;height:44px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ico:disabled{opacity:.35;cursor:default}
/* Heute */
.hero{background:var(--acc);color:var(--on);border-radius:26px;padding:clamp(22px,3.5vw,38px);display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:28px;align-items:center;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0 0 0 55%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 16px,transparent 16px 32px);z-index:-1}
.hero :focus-visible{outline-color:var(--on)}
.hero .k{font-weight:700;opacity:.88}
.hero h2{font-weight:800;font-size:clamp(2.5rem,6.4vw,3.8rem);line-height:1;margin:6px 0 12px}
.hero .chip{background:rgba(0,0,0,.17);color:inherit}
.hero p{margin:0;font-size:1.05rem;max-width:46ch}
.hero .btn.ink{background:#131416;color:#fff;margin-top:22px}
.alt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-weight:600}
.alt button{min-height:44px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:inherit;border-radius:99px;padding:0 16px;font:600 .95rem Barlow,sans-serif;cursor:pointer}
.ringbox{position:relative;width:210px;aspect-ratio:1;justify-self:end}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .trk{fill:none;stroke:rgba(0,0,0,.18);stroke-width:11}
.ringbox .arc{fill:none;stroke:var(--on);stroke-width:11;stroke-linecap:round}
.ringbox .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox b{font:800 3.6rem/1 "Barlow Condensed",sans-serif}.ringbox small{font-size:1.6rem;opacity:.75}
.ringbox span{font-weight:600;opacity:.9}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px 0 20px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px 10px;text-align:center;display:grid;gap:2px;justify-items:center}
.day b{font-size:.85rem;color:var(--mut)}
.day span{font:700 1.3rem/1 "Barlow Condensed",sans-serif}
.day em{height:16px;display:grid;place-items:center}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.day .dash{width:10px;height:2px;background:var(--line)}
.day.today{border:2px solid var(--ink)}
.day.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day.done b{color:inherit;opacity:.75}
.exrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.num{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font:700 1.05rem "Barlow Condensed",sans-serif;flex:none}
.nm{font-weight:600}.meta{color:var(--mut);font-size:.9rem}
.exrow .r{margin-left:auto;font:700 1.15rem "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.setup{border:2px solid var(--acc);margin-bottom:20px}
.srow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.tips{margin:0;padding-left:1.2em;display:grid;gap:10px}
/* Formular */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 .95rem Barlow,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.days button{min-width:48px;padding:0 10px}
input[type=text],input[type=number],input[type=search],select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{font:14px/1.4 ui-monospace,monospace;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc);height:44px;margin:0}
output{font:700 1.1rem "Barlow Condensed",sans-serif;white-space:nowrap}
.field{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.card h2+.field,.card h2+.tg{border-top:0;padding-top:4px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.tg>span{display:grid;gap:2px}
.tg.inline{border:0;min-height:44px;padding:0}
.tg input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked{background:var(--acc)}.tg input:checked::after{transform:translateX(22px)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.step button{width:44px;height:42px;border:0;background:var(--soft);color:var(--ink);font:700 1.25rem Barlow,sans-serif;cursor:pointer}
.step output{min-width:52px;text-align:center;padding:0 6px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.banner{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:var(--r);padding:16px 18px;margin-bottom:20px;border-left:5px solid var(--acc)}
.banner>div:first-child{display:grid;gap:2px}
/* Plan */
.srow2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:5px 0}
.whead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wname{font:700 1.35rem "Barlow Condensed",sans-serif!important;border-color:transparent!important;background:var(--soft)!important}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name acts" "ctrl ctrl";gap:12px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.whead+.pitem{border-top:0}
.pi-name{grid-area:name}
.pi-name b{font-size:1.08rem}
.pi-ctrl{grid-area:ctrl;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;align-items:end}
.pi-ctrl .step{display:flex;width:100%}
.pi-ctrl .step output{flex:1}
.pitem .acts{grid-area:acts;display:flex;align-self:start;background:var(--soft);border-radius:12px;overflow:hidden}
.pitem .acts .ico{background:none;border-radius:0;width:44px;height:44px}
.pitem .acts .ico.del{color:#e5484d;border-left:1.5px solid var(--line)}
@media(min-width:900px){.pitem{grid-template-columns:minmax(0,1fr) minmax(0,440px) auto;grid-template-areas:"name ctrl acts"}.pitem .acts{align-self:end}}
.lab{display:block;font-size:.82rem;color:var(--mut);margin-bottom:3px;font-weight:600}
.win{width:100%!important}
.acts{display:flex;gap:6px}
/* Übungen */
.filters{display:grid;gap:12px;margin-bottom:18px}
.filters .row{gap:12px 20px}
.filters select{width:auto;min-width:200px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.ex{display:flex;flex-direction:column;gap:10px}
.ex p{margin:0;color:var(--mut);font-size:.95rem}
.ex .warn{color:var(--acc);font-weight:600;font-size:.88rem}
.ex .add{margin-top:auto}
.lvl{display:inline-flex;align-items:center;gap:3px;flex:none}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line)}.lvl i.on{background:var(--acc)}
.lvl em{font-style:normal;font-size:.82rem;color:var(--mut);margin-left:4px}
.empty{text-align:center;padding:36px 20px;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.pinfo{padding-top:4px}
.bwnow{display:grid;gap:2px;margin-bottom:8px}.bwnow b{font:800 2.5rem/1 "Barlow Condensed",sans-serif}.bwnow span{color:var(--mut)}
.fig{position:relative;height:190px;margin-bottom:6px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font:600 13px Barlow,sans-serif;fill:var(--mut)}
.fig .gl{stroke:var(--line)}.fig .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.fig .dt{fill:var(--acc)}.fig .dt.last{stroke:var(--card);stroke-width:3}.fig .tl{stroke:var(--ink);stroke-dasharray:5 5;opacity:.45}
/* Fortschritt */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:16px}
.stat .v{font:800 2.5rem/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.stat .l{color:var(--mut);font-size:.9rem;margin-top:4px}
.plot{position:relative;height:150px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar em{font:700 1rem "Barlow Condensed",sans-serif;font-style:normal;height:20px}
.bar i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--ink);opacity:.85}
.bar i.hit{background:var(--acc);opacity:1}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--mut);pointer-events:none}
.goal span{position:absolute;right:0;top:-24px;font-size:.82rem;color:var(--mut);background:var(--card);padding:0 4px}
.blab{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:8px;text-align:center;font-size:.82rem;color:var(--mut);white-space:nowrap}
.mrow{display:grid;grid-template-columns:86px minmax(0,1fr) 40px;gap:10px;align-items:center;padding:6px 0}
.track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:99px}
.mrow b{text-align:right;font:700 1.05rem "Barlow Condensed",sans-serif}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow .d{width:74px;flex:none;font-weight:600;color:var(--mut);font-size:.9rem}
.hrow .x{flex:1}
/* Modal, Toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:22px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px}
.sheet p{margin:0 0 8px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.sheet .err{color:#c62828;font-weight:600;min-height:1.4em}
@media(min-width:700px){.modal{align-items:center}}
.plist{display:grid;gap:6px}
.ghead{display:flex;align-items:baseline;gap:8px;font:700 1.3rem/1.1 "Barlow Condensed",sans-serif;margin:14px 0 2px;grid-column:1/-1}
.ghead span{font:600 .9rem Barlow,sans-serif;color:var(--mut)}
.plist .ghead:first-child,.lib .ghead:first-child{margin-top:0}
.pick .demobox{width:72px;height:52px;max-height:none;margin:0;flex:none;color:var(--ink)}
.pick>span{flex:1}
.pick .demobox .lb{stroke-width:8}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;min-height:56px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem}
.pick span{display:grid}.pick small{color:var(--mut);font-size:.85rem}
.pick.in{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;min-height:48px;border-radius:14px;display:none;align-items:center;gap:10px;z-index:70;max-width:calc(100% - 32px);font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.on{display:flex}
.toast button{background:none;border:0;color:var(--acc);font:700 1rem Barlow,sans-serif;min-height:40px;padding:0 10px;cursor:pointer;filter:brightness(1.25)}
/* Training */
.sess{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--acc);color:var(--on);padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px) calc(18px + env(safe-area-inset-bottom));overflow:auto}
.sess.on{display:flex}
.sess.rest{background:#141518;color:#f2f1ec}
.sess :focus-visible{outline-color:currentColor}
.sess-top{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;margin:0 auto}
.sess .sx{background:rgba(0,0,0,.18);color:inherit}
.sess.rest .sx{background:rgba(255,255,255,.1)}
.prog{flex:1;height:8px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.prog i{display:block;height:100%;background:currentColor;border-radius:inherit}
.sess.rest .prog{background:rgba(255,255,255,.14)}.sess.rest .prog i{background:var(--acc)}
.ptxt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.sess-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;max-width:640px;margin:0 auto;width:100%;padding:18px 0}
.phase{font-weight:700;opacity:.88}
.sess h2{font-weight:800;font-size:clamp(2.3rem,7vw,3.8rem);line-height:1;margin:0}
.cues{max-width:44ch;opacity:.92;margin:0}
.ring{position:relative;width:min(68vw,290px);aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:currentColor;opacity:.18;stroke-width:12}
.ring .arc{fill:none;stroke:currentColor;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.sess.rest .ring .arc{stroke:var(--acc)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(3.4rem,15vw,5.6rem)/1 "Barlow Condensed",sans-serif}
.huge{font:800 clamp(5.5rem,24vw,9.5rem)/.9 "Barlow Condensed",sans-serif}
.hint2{font-weight:600;opacity:.88}
.bigstep{display:flex;align-items:center;gap:clamp(14px,5vw,34px)}
.bigstep button,.wrow button{width:64px;height:64px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:inherit;font:700 2rem Barlow,sans-serif;cursor:pointer;flex:none}
.wrow{display:flex;align-items:center;gap:14px;font-weight:600}
.wrow button{width:48px;height:48px;font-size:1.5rem}
.wrow b{font:700 1.6rem "Barlow Condensed",sans-serif;min-width:90px;white-space:nowrap}
.next{display:grid;gap:2px;background:rgba(255,255,255,.08);border-radius:16px;padding:14px 22px;min-width:min(100%,320px)}
.sess:not(.rest) .next{background:rgba(0,0,0,.14)}
.next span{opacity:.75;font-weight:600;font-size:.92rem}.next b{font:700 1.5rem "Barlow Condensed",sans-serif}
.sess .chips{justify-content:center}.sess .chip{background:rgba(255,255,255,.1);color:inherit}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;width:100%}
.sumgrid div{background:rgba(0,0,0,.14);border-radius:16px;padding:14px}
.sumgrid b{display:block;font:800 2.6rem/1 "Barlow Condensed",sans-serif}
.sess-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:640px;margin:0 auto;width:100%}
.sess-foot .btn{flex:1 1 140px;min-height:58px;font-size:1.1rem}
.sess .btn.main{background:#131416;color:#fff}
.sess.rest .btn.main{background:var(--acc);color:var(--on)}
.sess .btn.sec{background:rgba(0,0,0,.18);color:inherit}
.sess.rest .btn.sec{background:rgba(255,255,255,.1)}
.demobox{width:min(78vw,330px);aspect-ratio:200/146;max-height:30vh;margin:0 auto}
.demobox svg{width:100%;height:100%;display:block;overflow:visible}
.demobox .lb{stroke:currentColor;stroke-width:7;stroke-linecap:round}
.demobox .far{opacity:.45}
.demobox .head{fill:currentColor}
.demobox .prop{stroke:currentColor;opacity:.35;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.demobox .band{stroke:var(--acc);stroke-width:2.5;stroke-dasharray:4 3}
.demobox .db{fill:var(--acc)}
.sess .demobox .band{stroke:currentColor;opacity:.75}
.sess .demobox .db{fill:currentColor}
.sess.rest .demobox .db{fill:var(--acc)}
.ex .demobox{width:100%;max-height:none;aspect-ratio:200/130;background:var(--soft);border-radius:14px;color:var(--ink);padding:6px 8px}
.next .demobox{width:170px;margin:6px auto 0}
.withdemo{gap:10px}
.withdemo h2{font-size:clamp(1.9rem,6vw,3rem)}
.withdemo .huge{font-size:clamp(4rem,17vw,6.6rem)}
.withdemo .ring{width:min(46vw,200px)}
.withdemo .ring .t{font-size:clamp(2.4rem,10vw,3.8rem)}
.withdemo .cues{font-size:.95rem}
@media(max-width:760px){
 .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
 .top .in{padding-top:12px;padding-bottom:12px}
 .tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30}
 .tabs button{flex:1;flex-direction:column;gap:2px;height:58px;padding:0 2px;font-size:.8rem}
 .tabs button[aria-current=page]{background:none;color:var(--acc)}
 main{padding-bottom:110px}
 .toast{bottom:92px}
}
@media(max-width:600px){
 .hero{grid-template-columns:1fr;gap:18px}
 .hero::before{inset:55% 0 0 0}
 .ringbox{width:150px;justify-self:start;order:0}
 .ringbox b{font-size:2.8rem}
 .hero .btn.ink{width:100%}
 .week{gap:4px}
 .srow2{grid-template-columns:90px minmax(0,1fr)}
 .filters select{width:100%}
 .blab span:nth-child(odd){visibility:hidden}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function vProg(){

 if(!h.length){$('#v-fortschritt').innerHTML=`<h1 class="title">Fortschritt</h1><p class="sub">Hier siehst du, wie du stärker wirst.</p><div class="card empty"><h2>Noch keine Trainings</h2><p>Nach deinem ersten Training erscheinen hier Statistiken, Bestleistungen und dein Verlauf.</p><button class="btn acc" data-act="nav" data-v="heute">Zum heutigen Training</button></div><div class="grid g2" style="margin-top:16px">${bodyCard()}</div>`;bodyObs();return}
 const W=7*864e5,cnt=m=>h.filter(x=>x.date>=m&&x.date<m+W).length;
 const thisW=cnt(mon.getTime());
 let streak=0,m=mon.getTime();if(thisW<s.weekGoal)m-=W;while(cnt(m)>=s.weekGoal&&streak<520){streak++;m-=W}
 const totSec=h.reduce((a,x)=>a+(x.dur||0),0),totReps=h.reduce((a,x)=>a+x.sets.reduce((b,y)=>b+(y.reps||0),0),0);
 const weeks=[];for(let k=7;k>=0;k--){const mm=mon.getTime()-k*W;const d=new Date(mm);weeks.push({c:cnt(mm),l:k===0?'jetzt':`${d.getDate()}.${d.getMonth()+1}.`})}
 const max=Math.max(s.weekGoal,...weeks.map(x=>x.c),1),H=118;
 const gc={};GROUPS.forEach(g=>gc[g]=0);const since=Date.now()-30*864e5;h.filter(x=>x.date>=since).forEach(x=>x.sets.forEach(y=>{const e=EXM[y.ex];if(e)gc[e.g]++}));const gmax=Math.max(1,...Object.values(gc));
 const pr={};h.forEach(x=>x.sets.forEach(y=>{if(!EXM[y.ex])return;const p=pr[y.ex]||(pr[y.ex]={reps:0,sec:0,w:0,d:0});p.reps=Math.max(p.reps,y.reps||0);p.sec=Math.max(p.sec,y.sec||0);p.w=Math.max(p.w,y.w||0);p.d=Math.max(p.d,x.date)}));
 const prs=Object.entries(pr).sort((a,b)=>b[1].d-a[1].d).slice(0,10);
 const rev=h.slice().reverse();
 $('#v-fortschritt').innerHTML=`<h1 class="title">${streak>=2?`${streak} Wochen am Stück!`:'Fortschritt'}</h1><p class="sub">${streak>=2?`Du hast dein Wochenziel ${streak} Wochen in Folge geschafft.`:'Jede Einheit zählt. Hier siehst du, wie du stärker wirst.'}</p>
 <div class="stats"><div class="card stat"><div class="v">${thisW}<span style="font-size:1.4rem;opacity:.6">/${s.weekGoal}</span></div><div class="l">diese Woche</div></div><div class="card stat"><div class="v">${streak}</div><div class="l">Wochen-Serie</div></div><div class="card stat"><div class="v">${h.length}</div><div class="l">Trainings gesamt</div></div><div class="card stat"><div class="v">${totSec>=3600?Math.floor(totSec/3600)+' h '+Math.round(totSec%3600/60):Math.round(totSec/60)+' min'}</div><div class="l">Trainingszeit</div></div><div class="card stat"><div class="v">${totReps.toLocaleString('de-AT')}</div><div class="l">Wiederholungen</div></div>${curKg()?`<div class="card stat"><div class="v">${h.reduce((a,x)=>a+kcal(x.dur),0).toLocaleString('de-AT')}</div><div class="l">kcal (geschätzt)</div></div>`:''}</div>
 <div class="grid g2"><div class="card"><h2>Trainings pro Woche</h2><div class="plot"><div class="goal" style="bottom:${s.weekGoal/max*H}px"><span>Ziel ${s.weekGoal}</span></div>${weeks.map(x=>`<div class="bar"><em>${x.c||''}</em><i class="${x.c>=s.weekGoal?'hit':''}" style="height:${x.c?Math.max(6,x.c/max*H):2}px"></i></div>`).join('')}</div><div class="blab">${weeks.map(x=>`<span>${x.l}</span>`).join('')}</div></div>
 ${bodyCard()}<div class="card"><h2>Muskelgruppen</h2><p class="hint" style="margin:-6px 0 8px">Sätze in den letzten 30 Tagen</p>${GROUPS.map(g=>`<div class="mrow"><span>${g}</span><div class="track"><i style="width:${gc[g]/gmax*100}%"></i></div><b>${gc[g]}</b></div>`).join('')}</div>

 <div class="card"><h2>Verlauf</h2>${rev.slice(0,histN).map(x=>`<div class="hrow"><span class="d">${fmtDate(x.date)}</span><div class="x"><div class="nm">${esc(x.name)}</div><div class="meta">${Math.max(1,Math.round(x.dur/60))} Min · ${x.sets.length} Sätze · ${x.sets.reduce((a,y)=>a+(y.reps||0),0)} Wdh.${kcal(x.dur)?` · ca. ${kcal(x.dur)} kcal`:''}</div></div><button class="ico" id="hd-${esc(x.id)}" data-act="hdel" data-id="${esc(x.id)}" aria-label="Eintrag löschen">${ic('trash',18)}</button></div>`).join('')}${rev.length>histN?`<button class="btn ghost" style="margin-top:10px" data-act="hmore">Mehr anzeigen</button>`:''}</div></div>`;

function bodyCard(){const s=S.settings,b=S.body,u=s.unit,last=b[b.length-1],first=b[0],diff=last&&b.length>1?last.kg-first.kg:0;
 return`<div class="card"><h2>Körpergewicht</h2><div class="row" style="align-items:flex-end;margin-bottom:14px;flex-wrap:nowrap"><div style="flex:1"><label class="lab" for="bw-in">Heute (${u})</label><input type="number" id="bw-in" step="0.1" min="20" inputmode="decimal" placeholder="${last?r1raw(toU(last.kg)):'z. B. 72'}"></div><button class="btn acc" id="blog" data-act="blog">Eintragen</button></div>

let bwRO=null;
function bodyObs(){if(bwRO){bwRO.disconnect();bwRO=null}const f=$('#bwfig');if(!f)return;if(typeof ResizeObserver==='function'){bwRO=new ResizeObserver(drawBody);bwRO.observe(f)}else drawBody()}
function drawBody(){const svg=$('#bwsvg');if(!svg)return;const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;const s=S.settings,b=S.body.slice(-30);if(b.length<2)return;
 const vals=b.map(x=>toU(x.kg));if(s.target)vals.push(toU(s.target));let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1}
 const pl=44,pr=12,pt=14,pb=24,x=i=>pl+i*(W-pl-pr)/(b.length-1),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
 let h=[hi,lo].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${r1(v)}</text>`).join('');

 h+=`<polyline class="ln" points="${b.map((p,i)=>x(i).toFixed(1)+','+y(toU(p.kg)).toFixed(1)).join(' ')}"/>`;
 h+=b.map((p,i)=>`<circle class="dt${i===b.length-1?' last':''}" cx="${x(i)}" cy="${y(toU(p.kg))}" r="${i===b.length-1?6:3.5}"/>`).join('');
 if(W>=300)h+=`<text x="${pl}" y="${H-4}">${fmtDate(b[0].date)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${fmtDate(b[b.length-1].date)}</text>`;
 svg.innerHTML=h}

 </div>`;

}

/* ---------- Training ---------- */
const RC=2*Math.PI*88;
function audioInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function beep(f=880,d=.12){if(!S.settings.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.3,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.03)}catch(e){}}
async function lockWake(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request('screen')}catch(e){WL=null}}
function releaseWake(){try{if(WL)WL.release()}catch(e){}WL=null}

function startTimer(sec,cb){stopTimer();T={total:sec,end:Date.now()+sec*1000,left:sec,paused:false,cb,last:-1};T.iv=setInterval(tick,200)}
function stopTimer(){if(T&&T.iv)clearInterval(T.iv);T=null}
function tick(){if(!T||T.paused)return;const left=Math.max(0,(T.end-Date.now())/1000);T.left=left;const sc=Math.ceil(left);if(sc!==T.last){T.last=sc;if(sc<=3&&sc>0)beep(660,.09)}updTimer();if(left<=0){const cb=T.cb;stopTimer();cb()}}
function updTimer(){if(!T)return;const el=$('#tnum');if(el)el.textContent=fmtT(Math.ceil(T.left));const c=$('#tarc');if(c)c.style.strokeDashoffset=String(RC*(1-T.left/T.total))}
const ring=()=>`<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" class="trk"/><circle id="tarc" cx="100" cy="100" r="88" class="arc" stroke-dasharray="${RC}" style="stroke-dashoffset:${T?RC*(1-T.left/T.total):0}"/></svg><div class="t" id="tnum">${T?fmtT(Math.ceil(T.left)):''}</div></div>`;

function startWorkout(wid){
 const w=wById(wid);if(!w||!w.items.length){toast('Dieses Training hat noch keine Übungen.');return}
 audioInit();const s=S.settings,steps=[];if(s.warmup)steps.push({k:'warm',sec:180});
 w.items.forEach((it,i)=>{for(let k=0;k<it.sets;k++){steps.push({k:'work',i,s:k});const last=i===w.items.length-1&&k===it.sets-1;if(!last)steps.push({k:'rest',sec:k<it.sets-1?s.rest:s.restEx})}});
 X={wid,name:w.name,items:JSON.parse(JSON.stringify(w.items)),steps,idx:0,start:Date.now(),log:[],cur:{reps:0,w:0},pre:false,done:false,prog:[]};
 lockWake();$('#sess').classList.add('on');document.body.style.overflow='hidden';enterStep();
}
function enterStep(){
 stopTimer();X.pre=false;const st=X.steps[X.idx];if(!st)return finish();
 if(st.k==='warm')startTimer(st.sec,()=>{beep(1046,.25);next()});
 else if(st.k==='rest')startTimer(st.sec,()=>{beep(1046,.3);next()});
 else{const it=X.items[st.i],e=EXM[it.ex];const prev=X.log.filter(l=>l.i===st.i&&l.w);X.cur={reps:it.reps,w:prev.length?prev[prev.length-1].w:it.w};
  if(e.t==='z'){const run=()=>{X.pre=false;beep(1046,.2);startTimer(it.sec,()=>{logSet(it.sec);beep(1046,.35);next()});renderSess()};
   if(S.settings.countdown>0){X.pre=true;startTimer(S.settings.countdown,run)}else{renderSess();run();return}}}
 renderSess();
}
function logSet(val){const st=X.steps[X.idx],it=X.items[st.i],z=EXM[it.ex].t==='z';X.log.push({i:st.i,ex:it.ex,reps:z?0:val,sec:z?val:0,w:z||!hasW(EXM[it.ex])?0:(X.cur.w||0)})}
function next(){X.idx++;enterStep()}
function finish(){
 stopTimer();X.end=Date.now();X.done=true;X.prog=[];
 if(S.settings.progression)X.items.forEach((it,i)=>{const e=EXM[it.ex],lg=X.log.filter(l=>l.i===i);if(lg.length>=it.sets&&lg.every(l=>e.t==='z'?l.sec>=it.sec:l.reps>=it.reps))X.prog.push(e.t==='z'?{i,ex:it.ex,f:'sec',v:Math.min(600,it.sec+5)}:{i,ex:it.ex,f:'reps',v:Math.min(100,it.reps+1)})});
 beep(784,.15);setTimeout(()=>beep(1046,.3),170);renderSess();
}
function closeSess(){stopTimer();X=null;$('#sess').className='sess';$('#sess').innerHTML='';document.body.style.overflow='';releaseWake();render()}
function renderSess(){
 const el=$('#sess');if(!X)return;const u=S.settings.unit;let cls='',body='',foot='';
 if(X.done){const sets=X.log.length,reps=X.log.reduce((a,l)=>a+l.reps,0),vol=X.log.reduce((a,l)=>a+l.reps*(l.w||0),0),dur=Math.max(1,Math.round((X.end-X.start)/60000));
  body=`<div class="phase">${esc(X.name)}</div><h2>${sets?'Starke Einheit!':'Training beendet'}</h2><div class="sumgrid"><div><b>${dur}</b><span>Minuten</span></div><div><b>${sets}</b><span>Sätze</span></div><div><b>${reps}</b><span>Wiederholungen</span></div>${vol?`<div><b>${Math.round(vol)}</b><span>${u} bewegt</span></div>`:''}${kcal((X.end-X.start)/1000)?`<div><b>${kcal((X.end-X.start)/1000)}</b><span>kcal (geschätzt)</span></div>`:''}</div>${X.prog.length?`<div class="next"><span>Nächstes Mal gesteigert</span>${X.prog.map(p=>`<b>${EXM[p.ex].n}: ${p.v}${p.f==='sec'?' s':' Wdh.'}</b>`).join('')}</div>`:''}`;
  foot=sets?`<button class="btn sec" data-act="sdiscard" id="s-dis">Verwerfen</button><button class="btn main" data-act="ssave" id="s-main">${ic('check')} Speichern</button>`:`<button class="btn main" data-act="sdiscard" id="s-main">Schließen</button>`;
 }else{
  const st=X.steps[X.idx];
  if(st.k==='warm'){cls='rest';body=`<div class="phase">Aufwärmen</div><h2>Locker machen</h2>${S.settings.demo?fig('jack'):''}${ring()}<div class="chips">${['Hampelmänner','Armkreisen','Hüftkreisen','Lockere Kniebeugen','Schultern rollen'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;foot=`<button class="btn main" data-act="snext" id="s-main">Los geht's</button>`}
  else if(st.k==='rest'){cls='rest';const nx=X.steps[X.idx+1];let nt='';if(nx&&nx.k==='work'){const it=X.items[nx.i];nt=`<div class="next"><span>Als Nächstes</span>${S.settings.demo?fig(AN[it.ex]):''}<b>${EXM[it.ex].n}</b><span>Satz ${nx.s+1} von ${it.sets} · ${tgt(it)}${hasW(EXM[it.ex])&&it.w?` · ${it.w} ${u}`:''}</span></div>`}body=`<div class="phase">Pause</div>${ring()}${nt}`;foot=`<button class="btn sec" data-act="sadd" id="s-add">+15 s</button><button class="btn main" data-act="snext" id="s-main">Pause beenden</button>`}
  else{const it=X.items[st.i],e=EXM[it.ex];const ph=`<div class="phase">Übung ${st.i+1} von ${X.items.length} · Satz ${st.s+1} von ${it.sets}</div>${S.settings.demo?fig(AN[e.id]):''}<h2>${e.n}</h2><p class="cues">${e.c}</p>`;
   if(e.t==='z'){body=ph+ring()+`<div class="hint2">${X.pre?'Gleich geht\'s los …':`Halten! Ziel ${it.sec} s`}</div>`;foot=`<button class="btn sec" data-act="sskip" id="s-skip">Überspringen</button>${X.pre?'':`<button class="btn sec" data-act="spause" id="s-pause">${T&&T.paused?'Weiter':'Pause'}</button>`}<button class="btn main" data-act="sztdone" id="s-main">${X.pre?'Sofort starten':'Fertig'}</button>`}
   else{body=ph+`<div class="bigstep"><button data-act="rm" id="s-rm" aria-label="Eine Wiederholung weniger">−</button><div><div class="huge" id="srep">${X.cur.reps}</div><div class="hint2">Wiederholungen · Ziel ${it.reps}</div></div><button data-act="rp" id="s-rp" aria-label="Eine Wiederholung mehr">+</button></div>${hasW(e)?`<div class="wrow"><span>Zusatzgewicht</span><button data-act="wm" id="s-wm" aria-label="Weniger Gewicht">−</button><b id="swt">${X.cur.w||0} ${u}</b><button data-act="wp" id="s-wp" aria-label="Mehr Gewicht">+</button></div>`:''}`;foot=`<button class="btn sec" data-act="sskip" id="s-skip">Überspringen</button><button class="btn main" data-act="sdone" id="s-main">${ic('check')} Satz geschafft</button>`}}
 }
 const pct=X.done?100:Math.round(X.idx/X.steps.length*100);
 el.className='sess on '+cls;
 el.innerHTML=`<div class="sess-top"><button class="ico sx" data-act="sx" aria-label="Training beenden">${ic('x')}</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt"><i style="width:${pct}%"></i></div><span class="ptxt">${pct} %</span></div><div class="sess-body${body.includes('demobox')?' withdemo':''}">${body}</div><div class="sess-foot">${foot}</div>`;
 initDemos(el);
 const m=$('#s-main');if(m)m.focus({preventScroll:true});
}
function saveSession(){
 S.history.push({id:uid(),date:X.start,wid:X.wid,name:X.name,dur:Math.round((X.end-X.start)/1000),sets:X.log.map(l=>({ex:l.ex,reps:l.reps,sec:l.sec,w:l.w}))});
 if(S.history.length>300)S.history=S.history.slice(-300);
 const w=wById(X.wid);
 if(w){X.prog.forEach(p=>{const it=w.items[p.i];if(it&&it.ex===p.ex)it[p.f]=p.v});X.items.forEach((it,i)=>{const lg=X.log.filter(l=>l.i===i&&l.w),pi=w.items[i];if(lg.length&&pi&&pi.ex===it.ex)pi.w=lg[lg.length-1].w})}
 save();closeSess();toast('Training gespeichert');
}

/* ---------- Aktionen ---------- */
function setSetting(k,v){const s=S.settings;if(['level','countdown'].includes(k))v=+v;s[k]=v;
 if(k==='goal'){const g=GOALS[v];s.sets=g.sets;s.rest=g.rest;s.restEx=g.restEx;if(S.setupDone)toast('Sätze und Pausen an dein Ziel angepasst')}
 if(['level','goal','split'].includes(k)&&S.setupDone)planStale=true;
 if(k==='accent')applyLook();save();render()}
function doRebuild(){S.plan=buildPlan(S.settings);planStale=false;L.target='';save();render();toast('Neuer Plan erstellt')}

function act(a,b){
 const d=b?b.dataset:{},s=S.settings;
 const w=d.w?wById(d.w):null,i=d.i!=null?+d.i:-1;
 switch(a){
 case'nav':V=d.v;render();window.scrollTo(0,0);break;
 case'undo':if(U){const f=U;U=null;$('#toast').classList.remove('on');f()}break;
 case'set':setSetting(d.k,d.v);break;
 case'eqt':s.equip[d.k]=!s.equip[d.k];if(S.setupDone)planStale=true;save();render();break;
 case'dayt':{const n=+d.d;s.days=s.days.includes(n)?s.days.filter(x=>x!==n):[...s.days,n];S.plan.schedule=buildSchedule(s,S.plan.workouts.filter(x=>x.items.length).length?S.plan.workouts.filter(x=>x.items.length):S.plan.workouts);save();render();break}
 case'setupgo':S.setupDone=true;planStale=false;S.plan=buildPlan(s);save();render();toast('Dein Plan ist fertig');break;
 case'setupskip':S.setupDone=true;save();render();break;
 case'staleok':planStale=false;render();break;
 case'rebuildnow':doRebuild();break;
 case'rebuild':modal('Plan neu erstellen?','<p>Deine aktuellen Trainings werden durch neue ersetzt, passend zu Erfahrung, Ziel und Ausrüstung. Dein Verlauf bleibt erhalten.</p>',[{t:'Abbrechen'},{t:'Neu erstellen',c:'acc',f:doRebuild}]);break;
 case'st':if(w&&w.items[i]){const it=w.items[i],dd=+d.d;if(d.f==='sets')it.sets=clamp(it.sets+dd,1,10);else if(d.f==='reps')it.reps=clamp(it.reps+dd,1,100);else it.sec=clamp(it.sec+dd*5,5,600);save();render()}break;
 case'up':case'down':if(w){const j=a==='up'?i-1:i+1;if(j>=0&&j<w.items.length){[w.items[i],w.items[j]]=[w.items[j],w.items[i]];save();render()}}break;
 case'del':if(w&&w.items[i]){const it=w.items.splice(i,1)[0];save();render();toast(`${EXM[it.ex].n} entfernt`,()=>{w.items.splice(i,0,it);save();render()})}break;
 case'wdel':if(w)modal('Training löschen?',`<p>„${esc(w.name)}“ wird aus deinem Plan entfernt. Dein Verlauf bleibt erhalten.</p>`,[{t:'Abbrechen'},{t:'Löschen',c:'danger',f:()=>{S.plan.workouts=S.plan.workouts.filter(x=>x!==w);Object.keys(S.plan.schedule).forEach(k=>{if(S.plan.schedule[k]===w.id)delete S.plan.schedule[k]});syncDays();save();render();toast('Training gelöscht')}}]);break;
 case'wadd':{const nw={id:uid(),name:'Neues Training',items:[]};S.plan.workouts.push(nw);save();render();openPicker(nw.id);break}
 case'addex':if(w)openPicker(w.id);break;
 case'pg':if(P){P.c=d.v;renderPicker()}break;
 case'pick':if(P){const pw=wById(P.w),e=EXM[d.ex];if(pw&&e){pw.items.push(mkItem(e,s));save();toast(`${e.n} hinzugefügt`);renderPicker()}}break;
 case'lg':L.c=d.v;vLib();break;
 case'ladd':{const tw=wById(L.target),e=EXM[d.ex];if(tw&&e){tw.items.push(mkItem(e,s));save();renderLibList();toast(`${e.n} → ${tw.name}`,()=>{tw.items.pop();save();renderLibList()})}break}
 case'hmore':histN+=20;render();break;
 case'blog':{const inp=$('#bw-in');if(inp&&inp.value)logWeight(inp.value);else toast('Bitte zuerst ein Gewicht eingeben');break}
 case'bdel':{const k=S.body.findIndex(x=>x.date===+d.t);if(k>=0){const r=S.body.splice(k,1)[0];save();render();toast('Eintrag gelöscht',()=>{S.body.splice(k,0,r);save();render()})}break}
 case'hdel':{const k=S.history.findIndex(x=>x.id===d.id);if(k>=0){const r=S.history.splice(k,1)[0];save();render();toast('Eintrag gelöscht',()=>{S.history.splice(k,0,r);save();render()})}break}
 case'sst':{const lim={sets:[1,8],weekGoal:[1,7]}[d.k];s[d.k]=clamp(s[d.k]+(+d.d),lim[0],lim[1]);save();render();break}
 case'copy':{const txt=JSON.stringify({app:'heimkraft',v:1,settings:S.settings,plan:S.plan,history:S.history,body:S.body,setupDone:true});const fb=()=>modal('Backup',`<p class="hint">Markiere den Text und kopiere ihn, z. B. in eine Notiz.</p><textarea rows="8" readonly>${esc(txt)}</textarea>`,[{t:'Schließen',c:'ink'}]);try{navigator.clipboard.writeText(txt).then(()=>toast('Backup in die Zwischenablage kopiert'),fb)}catch(e){fb()}break}
 case'import':modal('Backup laden','<p class="hint">Füge hier dein kopiertes Backup ein. Die aktuellen Daten werden ersetzt.</p><textarea id="imp" rows="8" aria-label="Backup-Text"></textarea><p class="err"></p>',[{t:'Abbrechen'},{t:'Laden',c:'ink',f:m=>{try{const dd=JSON.parse(m.querySelector('#imp').value);if(!dd||!dd.settings||!dd.plan)throw 0;S=normalize({...dd,setupDone:true});planStale=false;save();applyLook();render();toast('Backup geladen');}catch(e){m.querySelector('.err').textContent='Das sieht nicht nach einem gültigen Backup aus.';return false}}}]);break;
 case'reset':modal('Alles zurücksetzen?','<p>Einstellungen, Plan und Verlauf werden gelöscht. Das lässt sich nicht rückgängig machen. Tipp: Vorher ein Backup kopieren.</p>',[{t:'Abbrechen'},{t:'Zurücksetzen',c:'danger',f:()=>{S=normalize({});planStale=false;histN=12;save();applyLook();V='heute';render();toast('Zurückgesetzt')}}]);break;
 /* Training */
 case'start':startWorkout(d.w);break;
 case'sx':if(!X)break;if(X.done){closeSess();break}{const run=T&&!T.paused;if(run)T.paused=true;const resume=()=>{if(run&&T&&T.paused){T.end=Date.now()+T.left*1000;T.paused=false}};modal('Training beenden?','<p>Du kannst das Bisherige speichern oder verwerfen.</p>',[{t:'Weitermachen',f:resume},{t:'Verwerfen',c:'line',f:()=>closeSess()},{t:'Beenden & speichern',c:'ink',f:()=>finish()}],resume)}break;
 case'rp':case'rm':if(X){X.cur.reps=clamp(X.cur.reps+(a==='rp'?1:-1),0,300);$('#srep').textContent=X.cur.reps}break;
 case'wp':case'wm':if(X){const stp=s.unit==='kg'?1:2.5;X.cur.w=Math.max(0,Math.round(((X.cur.w||0)+(a==='wp'?stp:-stp))*10)/10);$('#swt').textContent=`${X.cur.w} ${s.unit}`}break;
 case'sdone':if(X){logSet(X.cur.reps);next()}break;
 case'sskip':case'snext':if(X)next();break;
 case'sztdone':if(X&&T){if(X.pre){const cb=T.cb;stopTimer();cb()}else{logSet(Math.round(T.total-T.left));next()}}break;
 case'spause':if(T){if(T.paused){T.end=Date.now()+T.left*1000;T.paused=false}else T.paused=true;renderSess()}break;
 case'sadd':if(T){T.end+=15000;T.total+=15;tick()}break;
 case'ssave':if(X)saveSession();break;
 case'sdiscard':closeSess();break;
 }
}

document.addEventListener('click',e=>{
 const mi=e.target.closest('[data-mi]');
 if(mi&&M){const a=M.acts[+mi.dataset.mi],m=$('#modal');let keep=false;if(a&&a.f){M.cancel=null;keep=a.f(m)===false}if(!keep&&$('#modal').classList.contains('on')&&$('#modal').contains(mi))closeModal(false);return}
 if(e.target.id==='modal'){closeModal(true);return}
 const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b);
});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f,s=S.settings;if(!f)return;
 if(f==='wname'){const w=wById(t.dataset.w);if(w){w.name=t.value.slice(0,40);save()}}
 else if(f==='name'){s.name=t.value.slice(0,30);save()}
 else if(f==='range'){s[t.dataset.k]=+t.value;const o=$('#o-'+t.dataset.k);if(o)o.textContent=fmtSec(+t.value)}
 else if(f==='libq'){L.q=t.value;renderLibList()}
 else if(f==='pq'&&P){P.q=t.value;renderPicker()}
});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f,s=S.settings;if(!f)return;
 if(f==='w'){const w=wById(t.dataset.w),it=w&&w.items[+t.dataset.i];if(it){it.w=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);save()}}
 else if(f==='sched'){if(t.value)S.plan.schedule[t.dataset.d]=t.value;else delete S.plan.schedule[t.dataset.d];syncDays();save();render()}
 else if(f==='tog'){s[t.dataset.k]=t.checked;if(t.dataset.k==='big')applyLook();save()}
 else if(f==='equip'){s.equip[t.dataset.k]=t.checked;planStale=true;save();render()}
 else if(f==='range'){save();render()}
 else if(f==='bw'){if(t.value)logWeight(t.value)}
 else if(f==='pnum'){const k=t.dataset.k,v=pnum(t.value),yr=new Date().getFullYear();if(k==='birth')s.birth=v>=1920&&v<=yr?Math.round(v):0;else if(k==='height')s.height=v>=100&&v<=250?Math.round(v):0;else if(k==='target'){const kg=fromU(v);s.target=kg>=20&&kg<=400?kg:0}save();render()}
 else if(f==='lonly'){L.only=t.checked;renderLibList()}
 else if(f==='ponly'&&P){P.only=t.checked;renderPicker()}
 else if(f==='libt'){L.target=t.value;renderLibList()}
 else if(f==='wname'){render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='bw-in'){e.preventDefault();act('blog')}if(e.key==='Escape'){if(M)closeModal(true);else if(X&&!X.done)act('sx')}});

applyLook();render();

/* ---------- Konto-Speicher ---------- */
async function cloud(){
 try{SYNC='loading';
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user){SYNC='local';return}
  const id=await user.id();if(!id){SYNC='local';return}
  const ref=db.collection('data/users/'+id).doc('heimkraft');
  const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
  dbRef=ref;SYNC='cloud';
  if(snap.exists){const dd=JSON.parse(JSON.stringify(snap.data()));
   if((+dd.updated||0)>=(S.updated||0)&&dd.settings&&dd.plan){S=normalize(dd);saveLocal();applyLook();if(!X)render()}else if(S.updated)flush()}
  else if(S.updated)flush();
 }catch(e){if(!dbRef)SYNC='local'}
 finally{if(V==='optionen')renderSyncLine()}
}
let tries=0;(function wait(){if(window.claude&&typeof window.claude.use==='function')cloud();else if(++tries<15)setTimeout(wait,200)})();
}
